spring:
  application:
    name: picture-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  session:
    store-type: redis
    timeout: 2h

server:
  port: ${SERVER_PORT:8123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelect
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null

# M0 暂不引入与 Springdoc 2.8 不兼容的 Knife4j 服务端增强，生产环境默认关闭接口文档。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
